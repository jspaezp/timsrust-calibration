[package]
name = "timsrust-calibration"
version = "0.2.1"
edition = "2021"
description = "Physical m/z and mobility calibration converters for timsTOF TDF data"
license = "Apache-2.0"
repository = "https://github.com/jspaezp/timsrust-calibration"
readme = "README.md"
keywords = ["mass-spectrometry", "timstof", "bruker", "calibration", "proteomics"]
categories = ["science"]
exclude = [".github", ".gitignore", "tests"]

[dependencies]
timsrust-core = "0.6.5"
turso = { version = "0.6", default-features = false }
thiserror = "2"

[dev-dependencies]
timsrust = "=0.6.5"
# test data comes from the checked-in timsrust test fixtures
